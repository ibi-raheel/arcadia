<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.btn { font-family: var(--font-display); font-style: italic; font-size: 17px; padding: 10px 22px; border: none; border-radius: 30px; cursor: pointer; letter-spacing: 0.3px; }
.btn-primary { color: #050208; background: linear-gradient(135deg, #d4a868 0%, #8a6a3a 45%, #3e2a14 100%); box-shadow: 0 8px 18px rgba(0,0,0,0.6), inset 0 -4px 10px rgba(0,0,0,0.4), inset 0 2px 4px rgba(212,168,104,0.55); }
.btn-wax { background: linear-gradient(135deg, #8f2530, #5a1820); color: var(--vellum); box-shadow: 0 8px 18px rgba(80,10,20,0.55), inset 0 -4px 10px rgba(30,0,0,0.45), inset 0 2px 4px rgba(255,200,200,0.2); }
.btn-ghost { background: transparent; color: var(--vellum); border: 1px solid var(--bronze); }
</style></head>
<body><div class="desk">
  <div class="kicker" style="color: var(--vellum-2); margin-bottom: 14px;">buttons · primary · wax · ghost</div>
  <div class="vellum" style="padding: 22px 24px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; background: linear-gradient(180deg, #3a2614, #1e1208);">
    <button class="btn btn-primary">step inside →</button>
    <button class="btn btn-wax">seal it</button>
    <button class="btn btn-ghost">set aside</button>
  </div>
</div></body></html>

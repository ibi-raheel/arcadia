<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="desk">
  <div class="kicker" style="color: var(--vellum-2); margin-bottom: 14px;">guild medallions · earned · aged · locked</div>
  <div class="vellum" style="padding: 22px 24px;">
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; justify-items: center;">
      <div style="text-align: center;">
        <div style="width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, #d4a868, #8a6a3a 50%, #3e2a14); box-shadow: 0 6px 14px rgba(0,0,0,0.6), inset 0 -4px 10px rgba(0,0,0,0.45), inset 0 3px 5px rgba(212,168,104,0.5); display: grid; place-items: center; color: #050208; font-family: var(--font-display); font-style: italic; font-size: 11px; line-height: 1.1; text-align: center;">
          <div><div style="font-size: 26px;">✦</div>first hello</div>
        </div>
        <div style="font-family: var(--font-hand); font-size: 13px; color: var(--ink-quiet); margin-top: 4px;">freshly cast</div>
      </div>
      <div style="text-align: center;">
        <div style="width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, #d4a868, #8a6a3a 50%, #3e2a14); box-shadow: 0 6px 14px rgba(0,0,0,0.6), inset 0 -4px 10px rgba(0,0,0,0.45), inset 0 3px 5px rgba(212,168,104,0.5); display: grid; place-items: center; color: #050208; font-family: var(--font-display); font-style: italic; font-size: 11px; line-height: 1.1; text-align: center;">
          <div><div style="font-size: 26px;">☉</div>seven suns</div>
        </div>
        <div style="font-family: var(--font-hand); font-size: 13px; color: var(--ink-quiet); margin-top: 4px;">freshly cast</div>
      </div>
      <div style="text-align: center;">
        <div style="width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, #88a080, #5a7a5c 50%, #3e5c44); box-shadow: 0 6px 14px rgba(0,0,0,0.6), inset 0 -4px 10px rgba(0,0,0,0.45); display: grid; place-items: center; color: rgba(10,30,15,0.75); font-family: var(--font-display); font-style: italic; font-size: 11px; line-height: 1.1; text-align: center;">
          <div><div style="font-size: 26px;">❦</div>kind word</div>
        </div>
        <div style="font-family: var(--font-hand); font-size: 13px; color: var(--ink-quiet); margin-top: 4px;">aged verdigris</div>
      </div>
      <div style="text-align: center;">
        <div style="width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, #3a3a3a, #1e1e1e); opacity: 0.6; display: grid; place-items: center; color: rgba(150,140,120,0.5); font-family: var(--font-display); font-style: italic; font-size: 11px; line-height: 1.1; text-align: center;">
          <div><div style="font-size: 26px;">◈</div>host a circle</div>
        </div>
        <div style="font-family: var(--font-hand); font-size: 13px; color: var(--ink-quiet); margin-top: 4px;">not yet struck</div>
      </div>
    </div>
  </div>
</div></body></html>

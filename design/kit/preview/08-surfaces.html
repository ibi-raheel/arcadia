<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="desk">
  <div class="kicker" style="color: var(--vellum-2); margin-bottom: 14px;">surfaces · scroll · vellum · ledger</div>
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;">
    <div style="position:relative; background: radial-gradient(at 30% 15%, #e3ce98, #e8d5a5 50%, #d9c38a); padding: 22px 16px 26px; box-shadow: 0 14px 26px rgba(0,0,0,0.5); border-radius: 2px; transform: rotate(-1deg);">
      <div style="position:absolute; top:-8px; left:-4px; right:-4px; height: 14px; background: repeating-linear-gradient(90deg, #a98a52 0 4px, #c4a971 4px 9px); border-radius: 50% 50% 4px 4px / 14px 14px 2px 2px; box-shadow: 0 3px 6px rgba(0,0,0,0.4);"></div>
      <div style="position:absolute; bottom:-8px; left:-4px; right:-4px; height: 14px; background: repeating-linear-gradient(90deg, #a98a52 0 4px, #c4a971 4px 9px); border-radius: 4px 4px 50% 50% / 2px 2px 14px 14px; box-shadow: 0 3px 6px rgba(0,0,0,0.4);"></div>
      <div class="kicker" style="font-size: 8px;">a rolled scroll</div>
      <div style="font-family: var(--font-display); font-style: italic; font-size: 18px; color: var(--ink); margin-top: 6px;">royal missive</div>
    </div>
    <div style="position:relative; background: linear-gradient(180deg, #e8d5a5, #d9c38a); padding: 22px 16px; box-shadow: 0 14px 26px rgba(0,0,0,0.5); border-radius: 3px; transform: rotate(0.6deg);">
      <div style="position:absolute; top: 12px; left:-6px; right:-6px; height: 4px; background: linear-gradient(180deg, #3a1c10, #1a0a06); border-radius: 2px; box-shadow: 0 2px 3px rgba(0,0,0,0.5);"></div>
      <div class="kicker" style="font-size: 8px; margin-top: 16px;">flat vellum</div>
      <div style="font-family: var(--font-display); font-style: italic; font-size: 18px; color: var(--ink); margin-top: 6px;">bound leaf</div>
    </div>
    <div style="position:relative; background: repeating-linear-gradient(180deg, transparent 0 18px, rgba(20,10,0,0.18) 18px 19px), linear-gradient(180deg, #d4b984, #c8ac72); padding: 22px 16px 26px; box-shadow: 0 14px 26px rgba(0,0,0,0.5); border-left: 3px double #5a3f22; border-radius: 2px 8px 8px 2px; transform: rotate(-0.4deg);">
      <div class="kicker" style="font-size: 8px;">ledger page</div>
      <div style="font-family: var(--font-display); font-style: italic; font-size: 18px; color: var(--ink); margin-top: 6px;">keeper's record</div>
    </div>
  </div>
</div></body></html>

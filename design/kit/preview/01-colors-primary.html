<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="desk">
  <div class="kicker" style="color: var(--vellum-2); margin-bottom: 14px;">I. colours of the night</div>
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 14px;">
    <div class="sw"><div class="color" style="background: linear-gradient(135deg, #0c0612, #000);"></div><div class="name">night</div><div class="hex">#050208</div></div>
    <div class="sw"><div class="color" style="background: radial-gradient(circle at 32% 28%, #b88c52, #8a6a3a 55%, #3e2a14);"></div><div class="name">bronze</div><div class="hex">#8a6a3a</div></div>
    <div class="sw"><div class="color" style="background: radial-gradient(circle at 40% 30%, #ffde9b, #ffb84a 50%, #e69a2a);"></div><div class="name">lantern</div><div class="hex">#ffb84a</div></div>
    <div class="sw"><div class="color" style="background: linear-gradient(135deg, #c9a14a, #8e6e28);"></div><div class="name">gilt</div><div class="hex">#c9a14a</div></div>
  </div>
</div></body></html>

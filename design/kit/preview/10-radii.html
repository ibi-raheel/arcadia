<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="desk">
  <div class="kicker" style="color: var(--vellum-2); margin-bottom: 14px;">radii · hair · card · pill · round</div>
  <div class="vellum">
    <div style="display: flex; gap: 20px; align-items: center; justify-content: space-around;">
      <div style="text-align: center;">
        <div style="width: 56px; height: 56px; background: var(--bronze); border-radius: 2px;"></div>
        <div style="font-family: var(--font-mono); font-size: 9px; margin-top: 6px; color: var(--ink-faint); letter-spacing: 1px;">2 · hair</div>
      </div>
      <div style="text-align: center;">
        <div style="width: 56px; height: 56px; background: var(--bronze); border-radius: 3px;"></div>
        <div style="font-family: var(--font-mono); font-size: 9px; margin-top: 6px; color: var(--ink-faint); letter-spacing: 1px;">3 · card</div>
      </div>
      <div style="text-align: center;">
        <div style="width: 56px; height: 56px; background: var(--bronze); border-radius: 8px;"></div>
        <div style="font-family: var(--font-mono); font-size: 9px; margin-top: 6px; color: var(--ink-faint); letter-spacing: 1px;">8 · soft</div>
      </div>
      <div style="text-align: center;">
        <div style="width: 96px; height: 36px; background: var(--bronze); border-radius: 30px;"></div>
        <div style="font-family: var(--font-mono); font-size: 9px; margin-top: 6px; color: var(--ink-faint); letter-spacing: 1px;">30 · pill</div>
      </div>
      <div style="text-align: center;">
        <div style="width: 56px; height: 56px; background: radial-gradient(circle at 32% 28%, #d4a868, #8a6a3a 55%, #3e2a14); border-radius: 50%;"></div>
        <div style="font-family: var(--font-mono); font-size: 9px; margin-top: 6px; color: var(--ink-faint); letter-spacing: 1px;">50% · round</div>
      </div>
    </div>
  </div>
</div></body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="desk">
  <div class="kicker" style="color: var(--vellum-2); margin-bottom: 14px;">elevation · page · lift · float · sunk</div>
  <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; padding: 10px 0 20px;">
    <div style="height: 80px; background: var(--vellum); border-radius: 3px; box-shadow: 0 6px 14px rgba(0,0,0,0.3); display: grid; place-items: center; font-family: var(--font-display); font-style: italic; font-size: 14px; color: var(--ink-soft);">resting</div>
    <div style="height: 80px; background: var(--vellum); border-radius: 3px; box-shadow: 0 14px 26px rgba(0,0,0,0.55); display: grid; place-items: center; font-family: var(--font-display); font-style: italic; font-size: 14px; color: var(--ink-soft);">float</div>
    <div style="height: 80px; background: var(--vellum); border-radius: 3px; box-shadow: 0 24px 46px rgba(0,0,0,0.62); display: grid; place-items: center; font-family: var(--font-display); font-style: italic; font-size: 14px; color: var(--ink-soft);">lift</div>
    <div style="height: 80px; background: var(--vellum); border-radius: 3px; box-shadow: inset 0 0 40px rgba(140,100,40,0.35); display: grid; place-items: center; font-family: var(--font-display); font-style: italic; font-size: 14px; color: var(--ink-soft);">sunk (inset)</div>
  </div>
</div></body></html>

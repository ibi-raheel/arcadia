<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="desk" style="min-height: 160px; position: relative; overflow: hidden;">
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 500px 200px at 50% 0%, rgba(255,184,74,0.35), transparent 60%); pointer-events: none;"></div>
  <div class="kicker" style="color: var(--vellum-2); margin-bottom: 14px; position: relative; z-index: 2;">section divider · chapter bar</div>
  <div style="display: flex; align-items: center; gap: 12px; margin-top: 40px; position: relative; z-index: 2;">
    <span style="font-family: 'IM Fell English SC', serif; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--gilt);">III. surfaces</span>
    <span style="flex: 1; height: 1px; background: repeating-linear-gradient(90deg, var(--bronze-deep) 0 6px, transparent 6px 10px);"></span>
    <span style="color: var(--ink-red); font-size: 14px;">✦</span>
    <span style="flex: 1; height: 1px; background: repeating-linear-gradient(90deg, var(--bronze-deep) 0 6px, transparent 6px 10px);"></span>
  </div>
</div></body></html>

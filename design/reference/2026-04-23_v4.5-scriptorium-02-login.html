<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcadia · the doorway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --night:        #050208;
    --night-2:      #0c0612;
    --night-deep:   #000000;
    --desk:         #3a2614;
    --desk-warm:    #4a2f18;
    --desk-lit:     #6a421f;
    --desk-edge:    #1e1208;
    --vellum:       #e8d5a5;
    --vellum-2:     #d9c38a;
    --vellum-3:     #c4a971;
    --vellum-shadow:#a98a52;
    --parchment:    #d9bf88;
    --scroll:       #e3ce98;
    --lantern:      #ffb84a;
    --lantern-2:    #e69a2a;
    --lantern-core: #ffde9b;
    --flame:        #fff3c8;
    --bronze:       #8a6a3a;
    --bronze-hi:    #b88c52;
    --bronze-bright:#d4a868;
    --bronze-deep:  #5a3f22;
    --bronze-dark:  #3e2a14;
    --verdigris:    #5a7a5c;
    --wax:          #8f2530;
    --wax-deep:     #5a1820;
    --oxblood:      #6d1a24;
    --ink:          #140a05;
    --ink-soft:     #3a2418;
    --ink-faint:    #6e5544;
    --ink-quiet:    #8f7b68;
    --ink-blue:     #1f3147;
    --gilt:         #c9a14a;
    --gilt-hi:      #e8c876;
    --leather:      #3a1c10;
    --leather-dark: #1a0a06;
    --font-display: 'IM Fell English', serif;
    --font-caps:    'IM Fell English SC', serif;
    --font-body:    'EB Garamond', serif;
    --font-hand:    'Caveat', cursive;
    --font-mono:    'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--night-deep); color: var(--ink); font-family: var(--font-body); font-size: 17px; overflow-x: hidden; }

  .night-stage {
    min-height: 100vh;
    background: linear-gradient(180deg, #050208 0%, #000 100%);
    position: relative;
    padding: 18px 24px 40px;
  }

  /* Topbar */
  .topbar { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 5; margin-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 48px; height: 48px; border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, var(--bronze-bright), var(--bronze) 50%, var(--bronze-deep) 100%);
    display: grid; place-items: center;
    color: var(--night); font-family: var(--font-display); font-style: italic; font-size: 26px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.7), inset 0 -3px 6px rgba(0, 0, 0, 0.45), inset 0 2px 3px rgba(212, 168, 104, 0.55);
  }
  .brand-text { font-family: var(--font-display); font-style: italic; font-size: 24px; color: var(--vellum); line-height: 1; }
  .back-link {
    font-family: var(--font-hand); font-size: 18px; color: var(--gilt); text-decoration: none;
    text-decoration: underline wavy var(--bronze); text-underline-offset: 4px;
  }
  .back-link:hover { color: var(--lantern-core); }

  /* Two-column stage */
  .stage {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 0;
    min-height: calc(100vh - 90px);
    background:
      linear-gradient(90deg, transparent 0, transparent 50%, rgba(0,0,0,0.4) 50%, transparent 50.5%),
      linear-gradient(180deg, #050208 0%, #000 100%);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7);
  }

  /* Bronze corner bosses */
  .stage::before, .stage::after {
    content: ''; position: absolute;
    width: 32px; height: 32px;
    background: radial-gradient(circle at 32% 28%, var(--bronze-bright), var(--bronze) 50%, var(--bronze-deep) 100%);
    border-radius: 4px;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.7), inset 0 -3px 5px rgba(0, 0, 0, 0.45), inset 0 2px 3px rgba(212, 168, 104, 0.6);
    z-index: 10;
  }
  .stage::before { top: 10px; left: 10px; }
  .stage::after  { top: 10px; right: 10px; }

  /* ─────────  LEFT: the cottage at midnight  ───────── */
  .scene {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 800px 500px at 50% 18%, rgba(255, 184, 74, 0.18), transparent 60%),
      linear-gradient(180deg, #020106 0%, #0a0410 35%, #150820 55%, #2a1020 80%, #3a1e1c 100%);
    padding: 60px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  /* Tiny stars */
  .scene::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(1px 1px at 12% 14%, #fff7d0, transparent 100%),
      radial-gradient(1.5px 1.5px at 22% 8%, #ffd998, transparent 100%),
      radial-gradient(0.8px 0.8px at 35% 24%, #ffffff, transparent 100%),
      radial-gradient(1.2px 1.2px at 48% 6%, #ffd998, transparent 100%),
      radial-gradient(0.8px 0.8px at 64% 18%, #ffffff, transparent 100%),
      radial-gradient(1px 1px at 78% 10%, #fff7d0, transparent 100%),
      radial-gradient(0.9px 0.9px at 88% 22%, #ffd998, transparent 100%),
      radial-gradient(1.3px 1.3px at 8% 32%, #ffffff, transparent 100%),
      radial-gradient(0.7px 0.7px at 55% 32%, #fff7d0, transparent 100%),
      radial-gradient(1px 1px at 92% 34%, #ffd998, transparent 100%);
    animation: twinkle 5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0.9; }
    50%     { opacity: 0.6; }
  }

  /* Moon */
  .moon {
    position: absolute;
    top: 80px; right: 90px;
    width: 84px; height: 84px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff3c8, #e8d5a5 70%, #a98a52 100%);
    box-shadow:
      0 0 40px rgba(255, 217, 152, 0.45),
      0 0 80px rgba(255, 217, 152, 0.22),
      inset -6px -4px 0 rgba(90, 65, 30, 0.35);
    z-index: 2;
  }
  .moon::before {
    content: '';
    position: absolute;
    top: 18px; left: 20px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: rgba(90, 65, 30, 0.22);
    box-shadow: 24px 10px 0 -4px rgba(90, 65, 30, 0.22), 10px 30px 0 -5px rgba(90, 65, 30, 0.18);
  }

  /* Scene SVG wrap */
  .scene-svg {
    position: relative;
    z-index: 3;
    width: 100%;
    max-width: 560px;
    margin: 0 auto 20px;
  }
  .scene-svg svg { width: 100%; height: auto; display: block; }

  .window-glow {
    animation: flicker 3.6s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes flicker {
    0%,100% { opacity: 0.95; }
    30%     { opacity: 0.78; }
    55%     { opacity: 1; }
    80%     { opacity: 0.86; }
  }
  .smoke {
    animation: rise 8s linear infinite;
    transform-origin: center;
  }
  @keyframes rise {
    0%   { transform: translateY(0) scale(0.8); opacity: 0.7; }
    50%  { opacity: 0.5; }
    100% { transform: translateY(-100px) scale(1.4); opacity: 0; }
  }
  .firefly-scene {
    animation: driftS 7s ease-in-out infinite;
  }
  @keyframes driftS {
    0%,100% { transform: translate(0,0); opacity: 0.9; }
    30%     { transform: translate(10px,-6px); opacity: 0.5; }
    60%     { transform: translate(-8px,4px); opacity: 1; }
  }

  .scene-caption {
    position: relative;
    z-index: 4;
    text-align: center;
    padding-top: 20px;
  }
  .scene-caption .line-1 {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 28px;
    color: var(--vellum);
    line-height: 1.25;
    text-shadow: 0 2px 10px rgba(0,0,0,0.7);
  }
  .scene-caption .line-1 em { color: var(--lantern); }
  .scene-caption .line-2 {
    margin-top: 8px;
    font-family: var(--font-hand);
    font-size: 22px;
    color: var(--gilt);
    transform: rotate(-1deg);
    display: inline-block;
  }

  /* ─────────  RIGHT: the desk with a scroll  ───────── */
  .desk-side {
    position: relative;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' seed='7'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>"),
      repeating-linear-gradient(92deg, transparent 0, transparent 50px, rgba(20, 8, 0, 0.22) 50px, rgba(20, 8, 0, 0.22) 52px),
      radial-gradient(ellipse at 50% 18%, var(--desk-lit) 0%, var(--desk-warm) 32%, var(--desk) 60%, var(--desk-edge) 100%);
    background-blend-mode: multiply, normal, normal;
    padding: 70px 60px 60px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  /* A second small lantern glow from top of desk side */
  .desk-side::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 380px;
    pointer-events: none;
    background: radial-gradient(ellipse 500px 320px at 50% 0, rgba(255, 184, 74, 0.34) 0%, rgba(255, 184, 74, 0.14) 40%, transparent 75%);
    mix-blend-mode: screen;
  }

  /* Hanging lantern on the right */
  .right-lantern {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 200px;
    z-index: 4;
    pointer-events: none;
  }
  .right-lantern .chain {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 2px; height: 60px;
    background: repeating-linear-gradient(180deg, var(--bronze-deep) 0 4px, var(--bronze) 4px 8px);
    opacity: 0.75;
  }
  .right-lantern svg {
    position: absolute;
    top: 54px; left: 50%;
    transform: translateX(-50%);
    animation: sway 6s ease-in-out infinite;
    transform-origin: 50% -60px;
  }
  @keyframes sway {
    0%,100% { transform: translateX(-50%) rotate(-0.8deg); }
    50%     { transform: translateX(-50%) rotate(0.8deg); }
  }

  /* Scroll on the desk */
  .scroll-wrap {
    position: relative;
    max-width: 480px;
    margin: 40px auto 0;
    z-index: 5;
    transform: rotate(-0.8deg);
  }
  .scroll {
    position: relative;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='2' seed='9'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>"),
      radial-gradient(at 30% 15%, var(--scroll) 0%, var(--vellum) 50%, var(--vellum-2) 100%);
    background-blend-mode: multiply, normal;
    padding: 50px 44px 54px;
    box-shadow: 0 22px 44px rgba(0, 0, 0, 0.65), inset 0 0 70px rgba(140, 100, 40, 0.2);
    border-radius: 2px;
  }
  .scroll::before, .scroll::after {
    content: '';
    position: absolute;
    left: -8px; right: -8px;
    height: 26px;
    background: repeating-linear-gradient(90deg, var(--vellum-shadow) 0 5px, var(--vellum-3) 5px 12px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.55);
  }
  .scroll::before { top: -14px; border-radius: 50% 50% 4px 4px / 26px 26px 2px 2px; }
  .scroll::after  { bottom: -14px; border-radius: 4px 4px 50% 50% / 2px 2px 26px 26px; }

  .scroll-head {
    text-align: center;
    margin-bottom: 28px;
  }
  .scroll-head .kicker {
    font-family: var(--font-caps);
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--wax);
    text-transform: uppercase;
  }
  .scroll-head h2 {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 48px;
    color: var(--ink);
    line-height: 1.05;
    margin-top: 6px;
  }
  .scroll-head h2 em { color: var(--oxblood); font-style: italic; }
  .scroll-head .byline {
    font-family: var(--font-hand);
    font-size: 20px;
    color: var(--ink-faint);
    margin-top: 8px;
    transform: rotate(-1deg);
    display: inline-block;
  }

  .ornament {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0 24px;
    color: var(--bronze);
  }
  .ornament .line { flex: 1; height: 1px; background: repeating-linear-gradient(90deg, var(--bronze-deep) 0 5px, transparent 5px 9px); }
  .ornament .orn { font-size: 15px; color: var(--wax); }

  /* Form */
  .field-group { margin-bottom: 22px; }
  .field-label {
    display: block;
    font-family: var(--font-hand);
    font-size: 18px;
    color: var(--ink-faint);
    margin-bottom: 4px;
  }
  .field {
    display: block;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--bronze);
    padding: 10px 2px 8px;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 24px;
    color: var(--ink);
    width: 100%;
    outline: none;
  }
  .field:focus { border-bottom-color: var(--wax); }

  .remember {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 18px;
    margin-bottom: 28px;
    font-family: var(--font-hand);
    font-size: 18px;
    color: var(--ink-soft);
  }
  .remember input {
    appearance: none;
    width: 20px; height: 20px;
    border: 2px solid var(--bronze);
    background: transparent;
    border-radius: 3px;
    position: relative;
    cursor: pointer;
  }
  .remember input:checked {
    background: var(--bronze-bright);
    border-color: var(--bronze-deep);
  }
  .remember input:checked::after {
    content: '✓';
    position: absolute;
    top: -2px; left: 2px;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 18px;
    color: var(--ink);
  }

  .btn-enter {
    width: 100%;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 22px;
    padding: 16px 26px;
    color: var(--night);
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='23'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.22'/></svg>"),
      linear-gradient(135deg, var(--bronze-bright) 0%, var(--bronze) 45%, var(--bronze-deep) 100%);
    background-blend-mode: multiply, normal;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    letter-spacing: 0.4px;
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.65), inset 0 -4px 12px rgba(0, 0, 0, 0.4), inset 0 3px 5px rgba(212, 168, 104, 0.55);
    transition: transform .2s;
  }
  .btn-enter:hover { transform: translateY(-2px); filter: brightness(1.08); }

  /* Alt auth */
  .alt {
    display: flex;
    gap: 10px;
    margin: 16px 0 10px;
  }
  .alt button {
    flex: 1;
    padding: 12px 10px;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 16px;
    color: var(--ink);
    background: rgba(234, 213, 165, 0.5);
    border: 1.5px solid var(--bronze);
    border-radius: 30px;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: background .2s;
  }
  .alt button:hover { background: rgba(234, 213, 165, 0.8); }

  .first-time {
    text-align: center;
    font-family: var(--font-hand);
    font-size: 18px;
    color: var(--ink-faint);
    margin-top: 16px;
  }
  .first-time a {
    color: var(--oxblood);
    text-decoration: underline wavy;
    text-underline-offset: 4px;
  }

  /* Wax seal at bottom-right of scroll */
  .scroll-seal {
    position: absolute;
    bottom: 12px; right: 30px;
    width: 60px; height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #c13340 0%, var(--wax) 55%, var(--wax-deep) 100%);
    box-shadow:
      0 4px 10px rgba(30, 0, 0, 0.6),
      inset 0 -4px 10px rgba(30, 0, 0, 0.45),
      inset 0 4px 8px rgba(255, 200, 200, 0.18);
    display: grid; place-items: center;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 26px;
    color: rgba(30, 0, 0, 0.6);
    transform: rotate(-8deg);
    z-index: 2;
  }
  .scroll-seal::before {
    content: ''; position: absolute; inset: 4px;
    border: 1.5px dashed rgba(30, 0, 0, 0.3);
    border-radius: 50%;
  }

  /* Quill resting on the desk */
  .quill {
    position: absolute;
    bottom: 40px; left: 50px;
    z-index: 5;
    opacity: 0.85;
  }
  .quill svg {
    width: 110px; height: auto;
    transform: rotate(-18deg);
    display: block;
    filter: drop-shadow(0 8px 14px rgba(0,0,0,0.6));
  }

  /* Ink splatter decoration */
  .ink-splat {
    position: absolute;
    bottom: 110px; right: 70px;
    opacity: 0.7;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .stage { grid-template-columns: 1fr; }
    .scene { padding: 40px 30px; min-height: 400px; }
    .desk-side { padding: 50px 36px 40px; }
    .scene-svg { max-width: 400px; }
    .scroll-head h2 { font-size: 36px; }
    .quill { display: none; }
  }
</style>
</head>
<body>

<div class="night-stage">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div class="brand-text">Arcadia</div>
    </div>
    <a href="index.html" class="back-link">← back to the hub</a>
  </div>

  <div class="stage">

    <!-- LEFT: midnight scene -->
    <div class="scene">
      <div class="moon"></div>

      <div class="scene-svg">
        <svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#2a1830"/>
              <stop offset="100%" stop-color="#140820"/>
            </linearGradient>
            <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#1a0a18"/>
              <stop offset="100%" stop-color="#0a0410"/>
            </linearGradient>
            <radialGradient id="windowLight" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fff3c8" stop-opacity="1"/>
              <stop offset="60%" stop-color="#ffb84a" stop-opacity="0.8"/>
              <stop offset="100%" stop-color="#ffb84a" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fff3c8" stop-opacity="1"/>
              <stop offset="40%" stop-color="#ffb84a" stop-opacity="0.7"/>
              <stop offset="100%" stop-color="#ffb84a" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <!-- Far hills -->
          <path d="M0 250 Q80 210 160 230 Q240 246 320 220 Q400 200 480 222 Q540 238 560 228 L560 380 L0 380 Z" fill="url(#hillFar)"/>
          <!-- Near hills -->
          <path d="M0 300 Q100 270 200 288 Q300 304 400 282 Q500 262 560 280 L560 380 L0 380 Z" fill="url(#hillNear)"/>

          <!-- Tiny trees on distant ridge -->
          <g fill="#0a0410" stroke="#1a0a18" stroke-width="0.5">
            <polygon points="120,230 124,218 128,230"/>
            <polygon points="140,226 144,212 148,226"/>
            <polygon points="360,218 364,204 368,218"/>
            <polygon points="380,222 384,208 388,222"/>
            <polygon points="430,220 434,206 438,220"/>
          </g>

          <!-- Path from viewer to cottage -->
          <path d="M280 380 Q290 350 285 320 Q278 300 282 280" fill="none" stroke="#3a2418" stroke-width="3" opacity="0.5"/>

          <!-- Cottage (center) -->
          <g transform="translate(230 212)">
            <!-- Ambient window-pool glow behind cottage -->
            <ellipse cx="50" cy="30" rx="100" ry="60" fill="url(#windowLight)" opacity="0.7" class="window-glow"/>

            <!-- Body -->
            <rect x="0" y="26" width="100" height="60" fill="#3a2418" stroke="#140a05" stroke-width="1.5"/>
            <!-- Vertical planks -->
            <line x1="16" y1="26" x2="16" y2="86" stroke="#140a05" stroke-width="0.8" opacity="0.6"/>
            <line x1="32" y1="26" x2="32" y2="86" stroke="#140a05" stroke-width="0.8" opacity="0.6"/>
            <line x1="48" y1="26" x2="48" y2="86" stroke="#140a05" stroke-width="0.8" opacity="0.6"/>
            <line x1="64" y1="26" x2="64" y2="86" stroke="#140a05" stroke-width="0.8" opacity="0.6"/>
            <line x1="82" y1="26" x2="82" y2="86" stroke="#140a05" stroke-width="0.8" opacity="0.6"/>

            <!-- Thatched roof -->
            <polygon points="-8,26 50,-8 108,26" fill="#2a1408" stroke="#140a05" stroke-width="1.5"/>
            <path d="M-6 24 L6 16 M10 22 L22 14 M26 20 L38 12 M42 18 L54 10 M58 20 L70 12 M74 22 L86 14 M90 24 L102 16"
                  stroke="#5a3a20" stroke-width="1" opacity="0.5"/>

            <!-- Chimney -->
            <rect x="70" y="0" width="10" height="22" fill="#2a1408" stroke="#140a05" stroke-width="1"/>
            <!-- Smoke -->
            <g class="smoke" style="animation-delay: -2s;">
              <ellipse cx="75" cy="-6" rx="5" ry="4" fill="rgba(220, 210, 200, 0.4)"/>
            </g>
            <g class="smoke" style="animation-delay: -5s;">
              <ellipse cx="76" cy="-12" rx="6" ry="4" fill="rgba(220, 210, 200, 0.3)"/>
            </g>

            <!-- Door -->
            <rect x="42" y="50" width="16" height="36" fill="#1a0a06" stroke="#140a05" stroke-width="1"/>
            <circle cx="53" cy="68" r="1" fill="#8a6a3a"/>

            <!-- Windows (lit) -->
            <rect x="10" y="40" width="18" height="16" fill="url(#windowLight)" stroke="#140a05" stroke-width="1" class="window-glow"/>
            <line x1="19" y1="40" x2="19" y2="56" stroke="#140a05" stroke-width="0.8"/>
            <line x1="10" y1="48" x2="28" y2="48" stroke="#140a05" stroke-width="0.8"/>
            <rect x="72" y="40" width="18" height="16" fill="url(#windowLight)" stroke="#140a05" stroke-width="1" class="window-glow" style="animation-delay: -1s;"/>
            <line x1="81" y1="40" x2="81" y2="56" stroke="#140a05" stroke-width="0.8"/>
            <line x1="72" y1="48" x2="90" y2="48" stroke="#140a05" stroke-width="0.8"/>

            <!-- Hanging lantern by the door -->
            <line x1="64" y1="48" x2="64" y2="56" stroke="#5a3f22" stroke-width="1"/>
            <ellipse cx="64" cy="66" rx="10" ry="8" fill="url(#lanternGlow)"/>
            <rect x="61" y="58" width="6" height="10" fill="#8a6a3a" stroke="#3e2a14" stroke-width="0.7"/>
            <circle cx="64" cy="63" r="1.8" fill="#fff3c8"/>
          </g>

          <!-- Fireflies -->
          <g class="firefly-scene"><circle cx="140" cy="300" r="2" fill="#ffd998"/><circle cx="140" cy="300" r="5" fill="#ffd998" opacity="0.3"/></g>
          <g class="firefly-scene" style="animation-delay: -2s;"><circle cx="420" cy="290" r="2" fill="#ffb84a"/><circle cx="420" cy="290" r="5" fill="#ffb84a" opacity="0.3"/></g>
          <g class="firefly-scene" style="animation-delay: -4s;"><circle cx="180" cy="330" r="1.5" fill="#ffd998"/><circle cx="180" cy="330" r="4" fill="#ffd998" opacity="0.3"/></g>
          <g class="firefly-scene" style="animation-delay: -5s;"><circle cx="380" cy="320" r="2" fill="#ffd998"/><circle cx="380" cy="320" r="4" fill="#ffd998" opacity="0.3"/></g>
          <g class="firefly-scene" style="animation-delay: -3s;"><circle cx="300" cy="340" r="1.6" fill="#ffb84a"/><circle cx="300" cy="340" r="4" fill="#ffb84a" opacity="0.3"/></g>
        </svg>
      </div>

      <div class="scene-caption">
        <div class="line-1">the world is dark.<br>the <em>lantern</em> is lit.</div>
        <div class="line-2">~ come in ~</div>
      </div>
    </div>

    <!-- RIGHT: scroll form -->
    <div class="desk-side">
      <!-- Lantern overhead -->
      <div class="right-lantern">
        <div class="chain"></div>
        <svg width="100" height="140" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="flameGlow2" cx="50%" cy="45%" r="50%">
              <stop offset="0%" stop-color="#fff3c8" stop-opacity="1"/>
              <stop offset="40%" stop-color="#ffb84a" stop-opacity="0.85"/>
              <stop offset="100%" stop-color="#ffb84a" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="bronzeGrad2" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#b88c52"/>
              <stop offset="50%" stop-color="#8a6a3a"/>
              <stop offset="100%" stop-color="#3e2a14"/>
            </linearGradient>
          </defs>
          <path d="M50 6 L50 14" stroke="url(#bronzeGrad2)" stroke-width="2"/>
          <circle cx="50" cy="10" r="4" fill="none" stroke="url(#bronzeGrad2)" stroke-width="1.5"/>
          <path d="M26 18 L74 18 L68 26 L32 26 Z" fill="url(#bronzeGrad2)" stroke="#3e2a14" stroke-width="1"/>
          <rect x="28" y="26" width="44" height="5" fill="#3e2a14"/>
          <path d="M34 31 L34 86 Q34 94 42 96 L58 96 Q66 94 66 86 L66 31 Z"
                fill="rgba(255, 184, 74, 0.16)" stroke="#8a6a3a" stroke-width="2"/>
          <line x1="50" y1="31" x2="50" y2="96" stroke="#3e2a14" stroke-width="1.5"/>
          <line x1="38" y1="31" x2="38" y2="96" stroke="#3e2a14" stroke-width="1" opacity="0.7"/>
          <line x1="62" y1="31" x2="62" y2="96" stroke="#3e2a14" stroke-width="1" opacity="0.7"/>
          <ellipse cx="50" cy="62" rx="30" ry="38" fill="url(#flameGlow2)"/>
          <rect x="45" y="58" width="10" height="28" rx="1.5" fill="#fff3c8"/>
          <line x1="50" y1="48" x2="50" y2="58" stroke="#140a05" stroke-width="1.2"/>
          <g>
            <path d="M50 38 Q55 48 53 56 Q50 60 47 56 Q45 48 50 38 Z" fill="#ffb84a"/>
            <path d="M50 44 Q52 50 51.5 54 Q50 58 48.5 54 Q48 50 50 44 Z" fill="#ff8a3a"/>
            <ellipse cx="50" cy="52" rx="1.3" ry="2.4" fill="#ffffff" opacity="0.9"/>
          </g>
          <path d="M32 96 L68 96 L74 104 L26 104 Z" fill="url(#bronzeGrad2)" stroke="#3e2a14" stroke-width="1"/>
          <ellipse cx="50" cy="110" rx="5" ry="1.6" fill="#3e2a14"/>
        </svg>
      </div>

      <div class="scroll-wrap">
        <div class="scroll">
          <div class="scroll-head">
            <div class="kicker">enter the scriptorium</div>
            <h2>step <em>inside</em>.</h2>
            <div class="byline">~ your name and the word that lets you in ~</div>
          </div>

          <div class="ornament">
            <span class="line"></span>
            <span class="orn">✦ ❖ ✦</span>
            <span class="line"></span>
          </div>

          <form onsubmit="event.preventDefault();">
            <div class="field-group">
              <label class="field-label">your name</label>
              <input type="email" class="field" placeholder="theo@arcadia.kin" value="theo@arcadia.kin">
            </div>

            <div class="field-group">
              <label class="field-label">the word that lets you in</label>
              <input type="password" class="field" placeholder="·············" value="··········">
            </div>

            <label class="remember">
              <input type="checkbox" checked>
              keep me inside for a while
            </label>

            <button class="btn-enter" type="submit">step inside →</button>

            <div class="ornament" style="margin: 20px 0 10px;">
              <span class="line"></span>
              <span class="orn" style="font-family: var(--font-hand); font-size: 15px; color: var(--ink-faint);">or by another door</span>
              <span class="line"></span>
            </div>

            <div class="alt">
              <button type="button">with Google</button>
              <button type="button">with GitHub</button>
            </div>

            <div class="first-time">
              first time here? <a href="#">ask the doorkeeper for a key</a>
            </div>
          </form>

          <div class="scroll-seal">A</div>
        </div>
      </div>

      <!-- Ink splatter accent -->
      <div class="ink-splat">
        <svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
          <circle cx="30" cy="30" r="7" fill="#140a05"/>
          <circle cx="46" cy="22" r="2.2" fill="#140a05"/>
          <circle cx="12" cy="42" r="1.6" fill="#140a05"/>
          <circle cx="42" cy="48" r="1.2" fill="#140a05"/>
          <circle cx="18" cy="18" r="1.8" fill="#140a05" opacity="0.7"/>
          <circle cx="52" cy="38" r="1" fill="#140a05" opacity="0.6"/>
        </svg>
      </div>

      <!-- Quill on desk -->
      <div class="quill">
        <svg viewBox="0 0 120 240" xmlns="http://www.w3.org/2000/svg">
          <!-- Shaft -->
          <path d="M60 220 Q56 150 64 80 Q70 40 82 8" fill="none" stroke="#3e2a14" stroke-width="1.5"/>
          <!-- Feather -->
          <path d="M82 8 Q60 40 62 80 Q60 110 58 140 Q56 170 60 200 Q54 160 46 120 Q40 80 52 40 Q62 20 82 8 Z"
                fill="#e8d5a5" stroke="#3e2a14" stroke-width="1"/>
          <!-- Feather veins -->
          <path d="M76 16 L64 24 M72 28 L58 38 M68 42 L54 54 M64 58 L50 72 M62 76 L48 92 M60 94 L46 112 M58 114 L46 134 M58 134 L48 158 M58 158 L50 184" stroke="#3e2a14" stroke-width="0.5" opacity="0.55"/>
          <!-- Nib -->
          <path d="M60 220 L54 232 L62 232 Z" fill="#140a05"/>
          <!-- Ink drip -->
          <circle cx="58" cy="238" r="1.5" fill="#140a05" opacity="0.7"/>
        </svg>
      </div>
    </div>

  </div>
</div>

</body>
</html>
